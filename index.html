<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Social profile profile</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="profile-card">
        <img
          src="assets/images/tonmoys6302.jpg"
          alt="User profile picture"
          class="profile-card__image"
        />
        <h2 class="profile-card__name">Tonmoy Sarker</h2>
        <p class="profile-card__address">Dhaka, Bangladesh</p>
        <p class="profile-card__bio">"Front-end developer and avid reader."</p>
        <ul class="profile-card__links">
          <a href="https://github.com/tonmoysarker">
            <li>GitHub</li>
          </a>
          <a href="https://www.frontendmentor.io/profile/tonmoysarker">
            <li>Frontend Mentor</li>
          </a>
          <a href="https://www.linkedin.com/in/tonmoy-sarker-6302/">
            <li>LinkedIn</li>
          </a>
          <a href="https://x.com/TonmoyS6302">
            <li>Twitter</li>
          </a>
        </ul>
      </section>
    </main>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.frontendmentor.io/profile/tonmoysarker"
        >Tonmoy Sarker</a
      >.
    </div>
  </body>
</html>
